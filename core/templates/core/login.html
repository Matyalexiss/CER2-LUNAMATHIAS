{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'core/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}?v=2">
    <title>Iniciar sesión | Fundación Patrimonio Vivo</title>
</head>
<body class="auth-page raleway">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card auth-card border-0 shadow-lg" style="max-width: 450px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <a class="auth-brand text-decoration-none fw-bold text-success d-block text-center" href="{% url 'home' %}">Fundación Patrimonio Vivo</a>
                <p class="auth-eyebrow mt-4 mb-2 text-muted text-center">Bienvenido de nuevo</p>
                <h1 class="h3 fw-bold mb-2 text-center monserrat">Iniciar sesión</h1>
                <p class="text-secondary mb-4 text-center">Acceda a su cuenta para continuar.</p>

                <!-- Mostrar errores de autenticación -->
                {% if form.errors %}
                    <div class="alert alert-danger py-2 px-3 small" role="alert">
                        Usuario o contraseña incorrectos. Por favor, intente nuevamente.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="login-username" class="form-label">Usuario</label>
                        <input type="text" 
                               class="form-control {% if form.errors %}is-invalid{% endif %}" 
                               id="login-username"
                               name="username" 
                               autocomplete="username" 
                               placeholder="Nombre de usuario" 
                               required>
                    </div>
                    <div class="mb-4">
                        <label for="login-password" class="form-label">Contraseña</label>
                        <input type="password" 
                               class="form-control {% if form.errors %}is-invalid{% endif %}" 
                               id="login-password"
                               name="password" 
                               autocomplete="current-password" 
                               placeholder="Su contraseña" 
                               required>
                    </div>
                    <button class="btn btn-success btn-lg w-100" type="submit">Iniciar sesión</button>
                </form>
            </div>
        </section>
    </main>
    <script src="{% static 'core/js/bootstrap.bundle.min.js' %}" defer></script>
</body>
</html>
